[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dxy-s5-cpag39"
version = "0.1.0"
description = "Portable source closure for the frozen S5-CPAG-39 Dxy measurement mainline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
