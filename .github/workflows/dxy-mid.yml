name: DXY-MID mask reproduction
on: [push, pull_request]
jobs:
  portable-mask-pipeline:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install '.[plot,test,report]'
      - name: Verify only the formal measurement package is installed
        run: python -c 'import dxy_mid, importlib.util; assert all(importlib.util.find_spec(n) is None for n in ["dxy_s5cpag", "dxy_dg3"]); print(dxy_mid.__version__)'
      - run: python -m unittest discover -s tests -v
      - name: Verify official 39-group CSV and Excel tables
        run: python mainline/scripts/build_mainline.py --check
      - run: dxy-mid measure --manifest examples/mask_demo/frames.csv --output outputs/ci-demo --workers 1
      - run: python scripts/verify_regression.py --actual outputs/ci-demo/frames.csv --expected examples/mask_demo/expected.csv --output outputs/ci-demo/regression.json
      - name: Reproduce the public real Ring failure (NaN is expected)
        run: python scripts/reproduce_public.py --case failure --output outputs/ci-public-failure --workers 1
