name: DXY-MID mask reproduction
on: [push, pull_request]
jobs:
  portable-mask-pipeline:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install '.[plot,test]'
      - run: python -c 'import dxy_mid; print(dxy_mid.__version__)'
      - run: python -m unittest discover -s tests -v
      - run: dxy-mid measure --manifest examples/mask_demo/frames.csv --output outputs/ci-demo --workers 1
      - run: python scripts/verify_regression.py --actual outputs/ci-demo/frames.csv --expected examples/mask_demo/expected.csv --output outputs/ci-demo/regression.json
